<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ats编辑</title>
<style>
/* ===== 1. 声明字体 ===== */
@font-face {
  font-family: 'MyFont';          /* 自定义名字，下面引用它 */
  src: url('1.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;              /* 字体加载前先用系统字体显示，避免白屏 */
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0f1115;
  /* ===== 2. 应用字体 ===== */
  font-family:'MyFont',-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#fff;
  user-select:none;
}
.logo{
  width:96px;height:96px;
  border-radius:24px;
  object-fit:cover;
  box-shadow:0 12px 32px rgba(99,102,241,.35);
}
.name{font-size:22px;font-weight:600;margin-top:20px;letter-spacing:1px}
.ver{font-size:13px;color:#8a8f9c;margin-top:8px}
.btn{
  margin-top:36px;
  width:210px;height:50px;
  border:none;border-radius:25px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(99,102,241,.4);
  transition:transform .15s,opacity .15s;
  /* 按钮也继承字体 */
  font-family:inherit;
}
.btn:active{transform:scale(.96);opacity:.85}
</style>
</head>
<body>

<img src="tb.png" alt="Ats" class="logo">
<div class="name">Ats编辑</div>
<div class="ver">版本:1.1 作者:Ants</div>
<button class="btn" id="dl">下载 APK</button>

<script>
document.getElementById('dl').onclick = function () {
  var a = document.createElement('a');
  a.href = '代码编辑.apk';
  a.download = '代码编辑.apk';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
</script>

</body>
</html>
