<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ats编辑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0f1115;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#fff;
  user-select:none;
}
.logo{
  width:96px;height:96px;
  border-radius:24px;
  background:linear-gradient(145deg,#3b82f6,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:700;
  box-shadow:0 12px 32px rgba(99,102,241,.35);
}
.name{font-size:22px;font-weight:600;margin-top:20px;letter-spacing:1px}
.ver{font-size:13px;color:#8a8f9c;margin-top:8px}
.btn{
  margin-top:36px;
  width:210px;height:50px;
  border:none;border-radius:25px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(99,102,241,.4);
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(.96);opacity:.85}
</style>
</head>
<body>

<div class="logo">Ats</div>
<div class="name">Ats编辑</div>
<div class="ver">版本 1.0</div>
<button class="btn" id="dl">下载 APK</button>

<script>
document.getElementById('dl').onclick = function () {
  var a = document.createElement('a');
  a.href = '代码编辑1.0.apk';
  a.download = '代码编辑1.0.apk';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
</script>

</body>
</html>
